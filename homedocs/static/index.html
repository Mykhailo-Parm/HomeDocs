<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>HomeDocs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📂%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="boot.js"></script>
</head>
<body>

<div id="auth" class="auth" hidden>
  <form id="authForm" class="auth-card" autocomplete="on">
    <h1>📂 HomeDocs</h1>
    <div id="authHint" class="muted"></div>
    <label><span data-i18n="username"></span><input id="aUser" name="username" autocomplete="username" required maxlength="40"></label>
    <label><span data-i18n="password"></span><input id="aPass" name="password" type="password" autocomplete="current-password" required></label>
    <label id="aPass2Wrap" hidden><span data-i18n="password_repeat"></span><input id="aPass2" type="password" autocomplete="new-password"></label>
    <div id="authErr" class="err" role="alert"></div>
    <button class="primary" id="authBtn" type="submit"></button>
    <div class="auth-foot">
      <select class="langSel" data-i18n-title="language"><option value="en">English</option><option value="uk">Українська</option><option value="de">Deutsch</option></select>
      <button type="button" class="icon themeBtn"></button>
    </div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1>📂 HomeDocs</h1>
    <div class="search"><input id="q" type="search" data-i18n-ph="search_ph" autocomplete="off"></div>
    <button class="primary" id="scan" data-i18n="scan"></button>
    <button id="uploadBtn" data-i18n="upload"></button>
    <input type="file" id="fileInput" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.txt">
    <span class="spacer"></span>
    <button id="viewBtn"></button>
    <select class="langSel" data-i18n-title="language"><option value="en">EN</option><option value="uk">UK</option><option value="de">DE</option></select>
    <button class="icon themeBtn"></button>
    <button class="icon" id="settingsBtn" data-i18n-title="settings">⚙</button>
    <span class="who hide-sm" id="who"></span>
    <button class="icon" id="logoutBtn" data-i18n-title="logout">⎋</button>
  </header>
  <div class="stats" id="stats"></div>
  <main id="main">
    <section id="deskView" hidden>
      <div class="desk-bar">
        <nav class="crumbs" id="crumbs"></nav>
        <span class="spacer"></span>
        <button id="newFolderBtn" data-i18n="new_folder"></button>
        <button id="emptyTrashBtn" class="danger" data-i18n="empty_trash" hidden></button>
      </div>
      <div class="desk" id="desk"></div>
      <div class="muted small desk-hint" data-i18n="desk_hint"></div>
    </section>
    <section id="listView">
      <div class="filters">
        <select id="fPerson"></select>
        <select id="fType"></select>
        <select id="fDocStatus"></select>
        <select id="fStatus"></select>
        <label class="date-range"><span data-i18n="date_from"></span><input type="date" id="fFrom"></label>
        <label class="date-range"><span data-i18n="date_to"></span><input type="date" id="fTo"></label>
        <button id="resetFilters" data-i18n="reset_filters"></button>
        <span class="spacer"></span>
        <span class="muted small" id="docCount"></span>
        <button id="listModeBtn"></button>
        <button id="exportBtn" data-i18n="export"></button>
      </div>
      <div class="bulk" id="bulk" hidden>
        <span id="bulkCount"></span>
        <button class="primary" id="bulkApprove" data-i18n="approve_selected"></button>
        <button class="danger" id="bulkTrash" data-i18n="trash_selected"></button>
        <button id="bulkClear" data-i18n="clear"></button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th class="ck"><input type="checkbox" id="checkAll" data-i18n-title="select_all"></th>
            <th data-s="title" data-i18n="col_doc"></th>
            <th data-s="person" data-i18n="col_person"></th>
            <th data-s="doc_type" data-i18n="col_type"></th>
            <th data-s="doc_date" data-i18n="col_date"></th>
            <th data-s="amount" data-i18n="col_amount"></th>
            <th data-s="due_date" data-i18n="col_due"></th>
            <th data-s="doc_status" data-i18n="col_status"></th>
            <th data-s="folder" data-i18n="col_folder"></th>
            <th data-s="added_at" data-i18n="col_added"></th>
            <th data-s="status" data-i18n="col_state"></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="cards list-cards" id="cardList" hidden></div>
    </section>
    <aside id="detail" hidden></aside>
  </main>
  <footer class="muted"><span data-i18n="shortcuts"></span> · <span id="provider"></span></footer>
  <datalist id="peopleList"></datalist>
</div>

<div class="drop" id="drop" hidden><div data-i18n="drop_here"></div></div>

<dialog id="settings">
  <div class="dlg-head">
    <div class="tabs" id="tabs"></div>
    <button class="icon" id="settingsClose" data-i18n-title="close">✕</button>
  </div>
  <div class="dlg-body" id="settingsBody"></div>
</dialog>

<dialog id="codeDlg">
  <div class="code-form">
    <p id="codeMsg"></p>
    <label class="muted small" for="codeInput" data-i18n="type_code"></label>
    <div class="code-row"><div class="code" id="codeVal"></div><input id="codeInput" inputmode="numeric" maxlength="3" autocomplete="off"></div>
    <div class="actions">
      <button type="button" id="codeCancel" data-i18n="cancel"></button>
      <button type="button" id="codeOk" class="danger-solid" disabled data-i18n="delete_forever"></button>
    </div>
  </div>
</dialog>

<div id="toasts" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
