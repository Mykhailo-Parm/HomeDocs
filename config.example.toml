# Скопируй этот файл в config.toml и поправь под себя.

# Папки (можно абсолютные пути, например "C:/Users/Mykhailo/Documents/HomeDocs/inbox")
inbox_dir   = "inbox"      # сюда кладёшь новые сканы
archive_dir = "archive"    # сюда копируются подтверждённые документы
data_dir    = "data"       # база данных SQLite
trash_dir   = "trash"      # корзина: сюда переносятся удалённые документы до окончательного удаления

# Типы документов и статусы настраиваются в интерфейсе (⚙ Настройки), ИИ может добавлять новые сам.

[ocr]
# Распознавание текста на сканах и фото (без интернета). Нужен Tesseract:
#   Windows: winget install UB-Mannheim.TesseractOCR   Linux: apt install tesseract-ocr tesseract-ocr-ukr tesseract-ocr-deu
enabled       = true
languages     = "ukr+deu+eng+rus"   # языки Tesseract через «+»
tesseract_cmd = ""                  # путь к tesseract.exe, если не нашёлся сам
dpi           = 300                 # чёткость страниц PDF для распознавания
max_pages     = 15                  # сколько страниц PDF распознавать

[ai]
# Провайдер: "gemini" (бесплатный ключ), "ollama" (локально), "claude"
provider = "gemini"

[ai.gemini]
model   = "gemini-3.5-flash"
api_key = ""               # или переменная окружения GEMINI_API_KEY

[ai.claude]
model   = "claude-haiku-5-5"
api_key = ""               # или переменная окружения ANTHROPIC_API_KEY

[ai.ollama]
model = "qwen2.5:7b"       # установи Ollama и выполни: ollama pull qwen2.5:7b
host  = "http://localhost:11434"
